<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="./gsap.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden;
    font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif; }
  .sticker { filter: drop-shadow(0 0 6px rgba(255,255,255,.9)); }
  .bubble {
    position:absolute; padding:26px 44px; background:#fff; border:7px solid #3d6b1e;
    border-radius:60px; font-size:64px; font-weight:900; color:#3d6b1e; white-space:nowrap;
  }
  
  body { background:linear-gradient(180deg,#eef5e2 0%,#dcedc8 100%); }
  .cup { position:absolute; bottom:430px; left:130px; width:540px; }
  .zuncha { position:absolute; bottom:400px; right:60px; width:560px; }
  .zuncha #expr-normal { display:none !important; }
  .zuncha #expr-sneaky { display:block !important; }
  #whisper { bottom:1310px; right:90px; transform:scale(0); transform-origin:bottom right;
    font-size:58px; }
  .straw2 { position:absolute; bottom:900px; left:560px; width:150px; height:26px;
    background:#8BCB59; border:6px solid #3d6b1e; border-radius:13px; transform:rotate(24deg); }

</style>
</head>
<body>
  <div id="root" data-composition-id="s3" data-start="0" data-duration="2.5" data-fps="30" data-width="1080" data-height="1920">
    <div id="stage" class="clip" data-start="0" data-duration="2.5" data-track-index="0">
      
<svg class="cup" viewBox="0 0 360 560" xmlns="http://www.w3.org/2000/svg">
  <g stroke-linejoin="round" stroke-linecap="round">
    <rect x="150" y="8" width="22" height="150" rx="10" fill="#8BCB59" stroke="#3d6b1e" stroke-width="6" transform="rotate(8 161 83)"/>
    <path d="M 76 120 Q 96 74 148 70 Q 186 42 226 66 Q 274 60 286 108 Q 300 132 284 150 L 76 150 Q 62 134 76 120 Z"
          fill="#eaf5da" stroke="#3d6b1e" stroke-width="7"/>
    <path d="M 96 118 Q 130 96 180 100 Q 230 104 258 122" fill="none" stroke="#8BCB59" stroke-width="14" stroke-linecap="round"/>
    <path d="M 70 150 L 290 150 L 262 530 Q 260 548 240 548 L 120 548 Q 100 548 98 530 Z"
          fill="#6FB234" stroke="#3d6b1e" stroke-width="8"/>
    <path d="M 84 240 L 276 240 L 266 380 L 94 380 Z" fill="#f6f9ef" stroke="none"/>
    <text x="180" y="322" text-anchor="middle" font-size="52" font-weight="900" fill="#3d6b1e"
          font-family="'Noto Sans JP','Hiragino Sans',sans-serif">ずんだ茶寮</text>
    <g transform="translate(130,338) scale(0.5)">
<svg width="200" height="110" viewBox="0 0 200 110" xmlns="http://www.w3.org/2000/svg" fill="none">
  <path d="M 30 72 Q 12 58 20 40 Q 30 20 56 24 Q 66 12 84 14 Q 100 16 106 30 Q 128 26 142 38 Q 158 50 152 68 Q 144 88 118 86 Q 104 96 86 92 Q 70 88 66 76 Q 44 82 30 72 Z"
        stroke="#6FB234" stroke-width="12" stroke-linejoin="round"/>
</svg></g>
  </g>
</svg>
      <div class="straw2" id="straw"></div>
      <svg class="zuncha sticker" viewBox="0 0 400 540" xmlns="http://www.w3.org/2000/svg">
  <!--
    ずんちゃ丸 ベクター正本（参照シート準拠のフラット2D・紙切り感）
    パレット: #FFFFFF / #FFD9D9 / #8BCB59 / #6FB234 / #4EBC3A / 輪郭 #3d6b1e
    頭身: 約2.2頭身（頭部が全高の6割）
    表情グループ: #expr-normal / #expr-sneaky / #expr-happy を CSS で切り替える
  -->
  <g id="zuncha" stroke-linecap="round" stroke-linejoin="round">

    <!-- 足 -->
    <ellipse cx="168" cy="508" rx="26" ry="15" fill="#FFFFFF" stroke="#3d6b1e" stroke-width="5"/>
    <ellipse cx="232" cy="508" rx="26" ry="15" fill="#FFFFFF" stroke="#3d6b1e" stroke-width="5"/>

    <!-- 体（黄緑の和装） -->
    <path d="M 148 372 L 252 372 Q 270 372 274 402 L 282 462 Q 284 486 258 490 L 142 490 Q 116 486 118 462 L 126 402 Q 130 372 148 372 Z"
          fill="#8BCB59" stroke="#3d6b1e" stroke-width="6"/>
    <!-- 衿合わせ -->
    <path d="M 200 372 L 178 400 M 200 372 L 222 400" fill="none" stroke="#FFFFFF" stroke-width="7"/>
    <!-- 前掛け（濃緑） -->
    <path d="M 150 414 L 250 414 Q 262 414 263 430 L 266 470 Q 266 486 248 487 L 152 487 Q 134 486 134 470 L 137 430 Q 138 414 150 414 Z"
          fill="#6FB234" stroke="#3d6b1e" stroke-width="5"/>
    <!-- 前掛けの紐結び -->
    <path d="M 188 414 Q 200 406 212 414 Q 206 420 200 418 Q 194 420 188 414 Z" fill="#4EBC3A" stroke="#3d6b1e" stroke-width="4"/>
    <!-- 前掛けの枝豆紋 -->
    <g stroke="#e9f5dc" stroke-width="5" fill="none">
      <path d="M 184 448 Q 186 438 196 437 Q 191 445 196 452 Q 186 452 184 448 Z"/>
      <path d="M 204 437 Q 214 438 216 448 Q 214 452 204 452 Q 209 445 204 437 Z"/>
    </g>

    <!-- 腕（短い前足） -->
    <ellipse cx="122" cy="412" rx="24" ry="17" fill="#FFFFFF" stroke="#3d6b1e" stroke-width="5" transform="rotate(-18 122 412)"/>
    <ellipse cx="278" cy="412" rx="24" ry="17" fill="#FFFFFF" stroke="#3d6b1e" stroke-width="5" transform="rotate(18 278 412)"/>

    <!-- フード（枝豆の黄緑） -->
    <ellipse cx="200" cy="222" rx="168" ry="158" fill="#8BCB59" stroke="#3d6b1e" stroke-width="7"/>

    <!-- 葉っぱ（感情パーツ。アニメ時は #leaf-l / #leaf-r を回転させる。フードより前面） -->
    <g id="leaf-l" transform="rotate(-10 186 72)">
      <path d="M 186 72 Q 172 20 128 10 Q 118 52 152 74 Q 172 82 186 72 Z" fill="#4EBC3A" stroke="#3d6b1e" stroke-width="5"/>
      <path d="M 178 66 Q 160 44 140 26" fill="none" stroke="#3d6b1e" stroke-width="3"/>
    </g>
    <g id="leaf-r" transform="rotate(10 214 72)">
      <path d="M 214 72 Q 228 20 272 10 Q 282 52 248 74 Q 228 82 214 72 Z" fill="#4EBC3A" stroke="#3d6b1e" stroke-width="5"/>
      <path d="M 222 66 Q 240 44 260 26" fill="none" stroke="#3d6b1e" stroke-width="3"/>
    </g>

    <!-- 顔（白・フードの中） -->
    <ellipse cx="200" cy="248" rx="122" ry="112" fill="#FFFFFF" stroke="none"/>

    <!-- 額の三粒のずんだ -->
    <g fill="#6FB234" stroke="#3d6b1e" stroke-width="4">
      <ellipse cx="152" cy="150" rx="17" ry="13" transform="rotate(-14 152 150)"/>
      <ellipse cx="200" cy="140" rx="18" ry="14"/>
      <ellipse cx="248" cy="150" rx="17" ry="13" transform="rotate(14 248 150)"/>
    </g>

    <!-- ほっぺ（共通） -->
    <ellipse cx="118" cy="288" rx="20" ry="13" fill="#FFD9D9"/>
    <ellipse cx="282" cy="288" rx="20" ry="13" fill="#FFD9D9"/>

    <!-- ===== 表情: 通常の微笑み ===== -->
    <g id="expr-normal">
      <circle cx="152" cy="248" r="23" fill="#231f20"/>
      <circle cx="248" cy="248" r="23" fill="#231f20"/>
      <circle cx="145" cy="240" r="8" fill="#FFFFFF"/>
      <circle cx="241" cy="240" r="8" fill="#FFFFFF"/>
      <path d="M 186 298 Q 200 310 214 298" fill="none" stroke="#3d6b1e" stroke-width="6"/>
    </g>

    <!-- ===== 表情: いたずら顔（細め目・にんまり） ===== -->
    <g id="expr-sneaky" style="display:none">
      <path d="M 130 244 Q 152 232 174 244" fill="none" stroke="#231f20" stroke-width="8"/>
      <path d="M 226 244 Q 248 232 270 244" fill="none" stroke="#231f20" stroke-width="8"/>
      <path d="M 182 294 Q 200 306 220 292 Q 212 300 200 300 Q 190 300 182 294 Z" fill="#231f20"/>
    </g>

    <!-- ===== 表情: 照れ笑い（にこにこ目・頬ぷく） ===== -->
    <g id="expr-happy" style="display:none">
      <path d="M 132 250 Q 152 234 172 250" fill="none" stroke="#231f20" stroke-width="8"/>
      <path d="M 228 250 Q 248 234 268 250" fill="none" stroke="#231f20" stroke-width="8"/>
      <path d="M 188 296 Q 200 306 212 296" fill="none" stroke="#3d6b1e" stroke-width="6"/>
      <ellipse cx="118" cy="288" rx="24" ry="16" fill="#FFC9C9"/>
      <ellipse cx="282" cy="288" rx="24" ry="16" fill="#FFC9C9"/>
    </g>
  </g>
</svg>
      <div class="bubble" id="whisper">つい、ひとくち……</div>
    </div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    tl.set(".zuncha", { rotation: -6, transformOrigin: "50% 90%" })
      .from(".zuncha", { x: 260, duration: 0.6, ease: "power3.out" }, 0.05)
      .to(".zuncha", { rotation: -11, y: 10, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0.7)
      .to("#leaf-l", { rotation: -18, svgOrigin: "186 72", duration: 0.18, yoyo: true, repeat: 5, ease: "sine.inOut" }, 0.7)
      .to("#leaf-r", { rotation: 18, svgOrigin: "214 72", duration: 0.18, yoyo: true, repeat: 5, ease: "sine.inOut" }, 0.7)
      .to("#whisper", { scale: 1, duration: 0.4, ease: "back.out(2)" }, 1.05)
      .to(".cup", { rotation: -2, transformOrigin: "bottom center", duration: 0.3, yoyo: true, repeat: 1 }, 1.3);
    window.__timelines["s3"] = tl;
  </script>
</body>
</html>
