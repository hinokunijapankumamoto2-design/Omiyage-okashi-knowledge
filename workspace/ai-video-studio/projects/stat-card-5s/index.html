<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="./gsap.min.js"></script>
<style>
  /* FRAME.md 準拠: 暖簾グリーン基調 / 太字900 / 1画面=背景+主役+文字1組 / ぽよん登場 */
  @font-face { font-family: 'Hiragino Sans'; src: local('Hiragino Sans'); }
  @font-face { font-family: 'Yu Gothic'; src: local('Yu Gothic'); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden;
    font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif; }
  .bg { position:absolute; inset:0; background:#5e9c30; }
  .mark { position:absolute; top:300px; left:50%; margin-left:-130px; width:260px; }
  #label { position:absolute; top:508px; width:100%; text-align:center;
    font-size:72px; font-weight:900; color:#ffffff; letter-spacing:.1em; }
  #num-wrap { position:absolute; top:700px; width:100%; text-align:center; color:#fff; }
  #num { font-size:460px; font-weight:900; line-height:1;
    font-variant-numeric: tabular-nums; display:inline-block; }
  #unit { font-size:110px; font-weight:900; display:inline-block; margin-left:12px; }
  #chip { position:absolute; top:1310px; left:50%; padding:24px 60px;
    background:#fff; color:#3d6b1e; font-size:64px; font-weight:900;
    border-radius:999px; white-space:nowrap; }
  #src { position:absolute; bottom:150px; width:100%; text-align:center;
    font-size:34px; font-weight:700; color:#ffffff; letter-spacing:.06em; }
</style>
</head>
<body>
  <div id="root" data-composition-id="stat" data-start="0" data-duration="5" data-fps="30"
       data-width="1080" data-height="1920" style="position:relative; width:1080px; height:1920px;">
    <div class="bg"></div>

    <svg class="mark clip" id="mark" data-start="0" data-duration="5" data-track-index="0"
         viewBox="0 0 200 110" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M 30 72 Q 12 58 20 40 Q 30 20 56 24 Q 66 12 84 14 Q 100 16 106 30 Q 128 26 142 38 Q 158 50 152 68 Q 144 88 118 86 Q 104 96 86 92 Q 70 88 66 76 Q 44 82 30 72 Z"
            stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
    </svg>

    <div class="clip" id="label" data-start="0" data-duration="5" data-track-index="1">完成動画</div>

    <div class="clip" id="num-wrap" data-start="0" data-duration="5" data-track-index="2">
      <span id="num">0</span><span id="unit">本</span>
    </div>

    <div class="clip" id="chip" data-start="0" data-duration="5" data-track-index="3">生成AI費 ¥0</div>

    <div class="clip" id="src" data-start="0" data-duration="5" data-track-index="4">
      2026.07.26 時点｜ずんだ茶寮 動画スタジオ（Claude Code × HyperFrames）
    </div>

    <audio class="clip" id="se" data-start="0" data-duration="5" data-track-index="9" src="se.wav"></audio>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const counter = { v: 0 };
    const numEl = document.getElementById('num');

    tl.set("#chip", { xPercent: -50, scale: 0 }, 0)
      .set("#num-wrap", { transformOrigin: "50% 60%" }, 0)
      // 枝豆マーク: ふわっと
      .from("#mark", { autoAlpha: 0, scale: 0.7, transformOrigin: "center", duration: 0.5, ease: "back.out(1.6)" }, 0.1)
      .from("#label", { autoAlpha: 0, y: 40, duration: 0.5, ease: "power3.out" }, 0.35)
      // 数字カウントアップ 0→3（決定論: 進行度の純関数）
      .to(counter, {
        v: 3, duration: 1.1, ease: "power2.out",
        onUpdate: () => { numEl.textContent = String(Math.round(counter.v)); },
      }, 0.6)
      // 着地のぽよん
      .fromTo("#num-wrap", { scale: 1 }, { scale: 1.07, duration: 0.16, yoyo: true, repeat: 1, ease: "sine.inOut" }, 1.7)
      // ¥0 チップ
      .to("#chip", { scale: 1, duration: 0.4, ease: "back.out(2.2)" }, 2.0)
      .from("#src", { autoAlpha: 0, duration: 0.45 }, 2.5)
      // 呼吸（静かな保持。FRAMEの「間」）
      .to("#mark", { y: -8, duration: 1.0, yoyo: true, repeat: 1, ease: "sine.inOut" }, 3.0);

    window.__timelines["stat"] = tl;
  </script>
</body>
</html>
