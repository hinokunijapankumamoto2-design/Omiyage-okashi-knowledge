<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="./gsap.min.js"></script>
<style>
  @font-face { font-family: 'Hiragino Sans'; src: local('Hiragino Sans'); }
  @font-face { font-family: 'Yu Gothic'; src: local('Yu Gothic'); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden;
    font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif; }
  .bg { position:absolute; inset:0; background:#efe9db; }
  .base { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .straw { position:absolute; height:30px; background:#7ec14f; border:7px solid #3d6b1e;
    border-radius:18px; transform-origin:left center; }
  .sub { position:absolute; bottom:170px; width:100%; text-align:center;
    font-size:58px; font-weight:900; color:#fff; -webkit-text-stroke:10px rgba(40,60,20,.85);
    paint-order:stroke; letter-spacing:.02em; }
  .bubble { position:absolute; padding:22px 40px; background:#fff; border:7px solid #3d6b1e;
    border-radius:56px; font-size:56px; font-weight:900; color:#3d6b1e; white-space:nowrap; }
  #hook { position:absolute; top:340px; width:100%; text-align:center; font-size:76px;
    font-weight:900; color:#fff; -webkit-text-stroke:12px rgba(40,60,20,.9); paint-order:stroke;
    line-height:1.35; }
  #zuncha-wrap { position:absolute; bottom:430px; left:50%; width:600px; margin-left:-300px;
    transform-origin:50% 88%; }
  #zuncha-wrap svg { width:100%; }
  #straw1 { top:1300px; left:300px; width:520px; }
  #straw2 { top:1010px; left:120px; width:460px; }
  #straw3 { top:1000px; left:-40px; width:560px; }
  #straw4a { top:1260px; left:150px; width:330px; }
  #straw4b { top:1420px; left:330px; width:300px; }
  #bang { position:absolute; top:1080px; left:720px; font-size:130px; font-weight:900; color:#e0524a;
    -webkit-text-stroke:10px #fff; paint-order:stroke; }
  #line-z { bottom:1460px; left:50%; }
  #wai { bottom:1260px; left:150px; transform-origin:bottom center; }
  #mini { position:absolute; bottom:330px; right:150px; width:250px; }
  #card { position:absolute; inset:0; background:rgba(94,156,48,.96); opacity:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:36px; }
  .copy-main { font-size:96px; font-weight:900; color:#fff; letter-spacing:.04em; }
  .copy-sub { font-size:54px; font-weight:700; color:#eaf5da; }
</style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-fps="30" data-width="1080" data-height="1920" style="position:relative; width:1080px; height:1920px;">
    <div class="bg"></div>

    <!-- track0: ベース動画（フォトステージング。実写が届いたら src 差し替えのみ） -->
    <video class="base clip" id="v-b1" data-start="0"   data-duration="1.5" data-track-index="0" src="media/b1_base.mp4" muted></video>
    <video class="base clip" id="v-b2" data-start="1.5" data-duration="2.5" data-track-index="0" src="media/b2_base.mp4" muted></video>
    <video class="base clip" id="v-b3" data-start="4"   data-duration="3"   data-track-index="0" src="media/b3_base.mp4" muted></video>
    <video class="base clip" id="v-b4" data-start="7"   data-duration="2.5" data-track-index="0" src="media/b4_base.mp4" muted></video>
    <video class="base clip" id="v-b5" data-start="9.5" data-duration="2.5" data-track-index="0" src="media/b5_base.mp4" muted></video>

    <!-- track1: ストロー -->
    <div class="straw clip" id="straw1"  data-start="0"   data-duration="1.5" data-track-index="1"></div>
    <div class="straw clip" id="straw2"  data-start="1.5" data-duration="2.5" data-track-index="1"></div>
    <div class="straw clip" id="straw3"  data-start="4"   data-duration="3"   data-track-index="1"></div>
    <div class="straw clip" id="straw4a" data-start="7"   data-duration="2.5" data-track-index="1"></div>
    <div class="straw clip" id="straw4b" data-start="7"   data-duration="2.5" data-track-index="7"></div>

    <!-- track2: ずんちゃ丸（1体を b3→b4→b5 で使い回す）とミニカップ -->
    <div class="clip" id="zuncha-wrap" data-start="4" data-duration="8" data-track-index="2">
      <svg viewBox="0 0 400 540" xmlns="http://www.w3.org/2000/svg">
  <!--
    ずんちゃ丸 ベクター正本（参照シート準拠のフラット2D・紙切り感）
    パレット: #FFFFFF / #FFD9D9 / #8BCB59 / #6FB234 / #4EBC3A / 輪郭 #3d6b1e
    頭身: 約2.2頭身（頭部が全高の6割）
    表情グループ: #expr-normal / #expr-sneaky / #expr-happy を CSS で切り替える
  -->
  <defs>
    <!-- 参照シートの柔らかい立体感（ぬいぐるみ/3Dフィギュア風）を淡い陰影で再現 -->
    <radialGradient id="g-hood" cx="0.38" cy="0.28" r="0.85">
      <stop offset="0%" stop-color="#a8d97c"/>
      <stop offset="55%" stop-color="#8BCB59"/>
      <stop offset="100%" stop-color="#74af41"/>
    </radialGradient>
    <radialGradient id="g-face" cx="0.42" cy="0.35" r="0.8">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="78%" stop-color="#fdfbf6"/>
      <stop offset="100%" stop-color="#f1ead9"/>
    </radialGradient>
    <radialGradient id="g-leaf" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0%" stop-color="#6fd05a"/>
      <stop offset="100%" stop-color="#3f9c2e"/>
    </radialGradient>
    <radialGradient id="g-bean" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0%" stop-color="#8cc75a"/>
      <stop offset="100%" stop-color="#5d9a28"/>
    </radialGradient>
    <linearGradient id="g-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9bd469"/>
      <stop offset="100%" stop-color="#7cb84a"/>
    </linearGradient>
    <linearGradient id="g-apron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dbc41"/>
      <stop offset="100%" stop-color="#63a233"/>
    </linearGradient>
    <radialGradient id="g-cheek" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFC9C9"/>
      <stop offset="70%" stop-color="#FFD9D9"/>
      <stop offset="100%" stop-color="#FFD9D9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-white" cx="0.4" cy="0.3" r="0.9">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#ece5d2"/>
    </radialGradient>
  </defs>
  <g id="zuncha" stroke-linecap="round" stroke-linejoin="round">

    <!-- 接地の淡い影 -->
    <ellipse cx="200" cy="516" rx="150" ry="20" fill="#000000" opacity="0.10"/>

    <!-- 足 -->
    <ellipse cx="168" cy="508" rx="26" ry="15" fill="url(#g-white)" stroke="#3d6b1e" stroke-width="5"/>
    <ellipse cx="232" cy="508" rx="26" ry="15" fill="url(#g-white)" stroke="#3d6b1e" stroke-width="5"/>

    <!-- 体（黄緑の和装） -->
    <path d="M 148 372 L 252 372 Q 270 372 274 402 L 282 462 Q 284 486 258 490 L 142 490 Q 116 486 118 462 L 126 402 Q 130 372 148 372 Z"
          fill="url(#g-body)" stroke="#3d6b1e" stroke-width="6"/>
    <!-- 衿合わせ -->
    <path d="M 200 372 L 178 400 M 200 372 L 222 400" fill="none" stroke="#FFFFFF" stroke-width="7"/>
    <!-- 前掛け（濃緑） -->
    <path d="M 150 414 L 250 414 Q 262 414 263 430 L 266 470 Q 266 486 248 487 L 152 487 Q 134 486 134 470 L 137 430 Q 138 414 150 414 Z"
          fill="url(#g-apron)" stroke="#3d6b1e" stroke-width="5"/>
    <!-- 前掛けの紐結び -->
    <path d="M 188 414 Q 200 406 212 414 Q 206 420 200 418 Q 194 420 188 414 Z" fill="#4EBC3A" stroke="#3d6b1e" stroke-width="4"/>
    <!-- 前掛けの枝豆紋 -->
    <g stroke="#e9f5dc" stroke-width="5" fill="none">
      <path d="M 184 448 Q 186 438 196 437 Q 191 445 196 452 Q 186 452 184 448 Z"/>
      <path d="M 204 437 Q 214 438 216 448 Q 214 452 204 452 Q 209 445 204 437 Z"/>
    </g>

    <!-- 腕（短い前足） -->
    <ellipse cx="122" cy="412" rx="24" ry="17" fill="url(#g-white)" stroke="#3d6b1e" stroke-width="5" transform="rotate(-18 122 412)"/>
    <ellipse cx="278" cy="412" rx="24" ry="17" fill="url(#g-white)" stroke="#3d6b1e" stroke-width="5" transform="rotate(18 278 412)"/>

    <!-- フード（枝豆の黄緑） -->
    <ellipse cx="200" cy="222" rx="168" ry="158" fill="url(#g-hood)" stroke="#3d6b1e" stroke-width="7"/>
    <ellipse cx="138" cy="120" rx="52" ry="30" fill="#ffffff" opacity="0.35" transform="rotate(-24 138 120)"/>

    <!-- 葉っぱ（感情パーツ。アニメ時は #leaf-l / #leaf-r を回転させる。フードより前面） -->
    <g id="leaf-l" transform="rotate(-10 186 72)">
      <path d="M 186 72 Q 172 20 128 10 Q 118 52 152 74 Q 172 82 186 72 Z" fill="#4EBC3A" stroke="#3d6b1e" stroke-width="5"/>
      <path d="M 178 66 Q 160 44 140 26" fill="none" stroke="#3d6b1e" stroke-width="3"/>
    </g>
    <g id="leaf-r" transform="rotate(10 214 72)">
      <path d="M 214 72 Q 228 20 272 10 Q 282 52 248 74 Q 228 82 214 72 Z" fill="#4EBC3A" stroke="#3d6b1e" stroke-width="5"/>
      <path d="M 222 66 Q 240 44 260 26" fill="none" stroke="#3d6b1e" stroke-width="3"/>
    </g>

    <!-- 顔（白・フードの中） -->
    <ellipse cx="200" cy="248" rx="122" ry="112" fill="url(#g-face)" stroke="none"/>

    <!-- 額の三粒のずんだ -->
    <g fill="url(#g-bean)" stroke="#3d6b1e" stroke-width="4">
      <ellipse cx="152" cy="150" rx="17" ry="13" transform="rotate(-14 152 150)"/>
      <ellipse cx="200" cy="140" rx="18" ry="14"/>
      <ellipse cx="248" cy="150" rx="17" ry="13" transform="rotate(14 248 150)"/>
    </g>

    <!-- ほっぺ（共通） -->
    <ellipse cx="118" cy="288" rx="24" ry="16" fill="url(#g-cheek)"/>
    <ellipse cx="282" cy="288" rx="24" ry="16" fill="url(#g-cheek)"/>

    <!-- ===== 表情: 通常の微笑み ===== -->
    <g id="expr-normal">
      <circle cx="152" cy="248" r="23" fill="#231f20"/>
      <circle cx="248" cy="248" r="23" fill="#231f20"/>
      <circle cx="145" cy="240" r="8" fill="#FFFFFF"/>
      <circle cx="241" cy="240" r="8" fill="#FFFFFF"/>
      <path d="M 186 298 Q 200 310 214 298" fill="none" stroke="#3d6b1e" stroke-width="6"/>
    </g>

    <!-- ===== 表情: いたずら顔（細め目・にんまり） ===== -->
    <g id="expr-sneaky" style="display:none">
      <path d="M 130 244 Q 152 232 174 244" fill="none" stroke="#231f20" stroke-width="8"/>
      <path d="M 226 244 Q 248 232 270 244" fill="none" stroke="#231f20" stroke-width="8"/>
      <path d="M 182 294 Q 200 306 220 292 Q 212 300 200 300 Q 190 300 182 294 Z" fill="#231f20"/>
    </g>

    <!-- ===== 表情: 照れ笑い（にこにこ目・頬ぷく） ===== -->
    <g id="expr-happy" style="display:none">
      <path d="M 132 250 Q 152 234 172 250" fill="none" stroke="#231f20" stroke-width="8"/>
      <path d="M 228 250 Q 248 234 268 250" fill="none" stroke="#231f20" stroke-width="8"/>
      <path d="M 188 296 Q 200 306 212 296" fill="none" stroke="#3d6b1e" stroke-width="6"/>
      <ellipse cx="118" cy="288" rx="24" ry="16" fill="#FFC9C9"/>
      <ellipse cx="282" cy="288" rx="24" ry="16" fill="#FFC9C9"/>
    </g>

    <!-- ===== 表情: 頬パンパン発覚顔（口いっぱい・目をそらす・口元に緑） ===== -->
    <g id="expr-puffed" style="display:none">
      <!-- ふくらんだ頬（大きく・ずんだ色がうっすら） -->
      <ellipse cx="128" cy="292" rx="34" ry="26" fill="#FFD9D9"/>
      <ellipse cx="272" cy="292" rx="34" ry="26" fill="#FFD9D9"/>
      <ellipse cx="128" cy="296" rx="20" ry="12" fill="#d9edc0" opacity="0.8"/>
      <ellipse cx="272" cy="296" rx="20" ry="12" fill="#d9edc0" opacity="0.8"/>
      <!-- 目をそらす（右上を見る点目） -->
      <circle cx="164" cy="240" r="17" fill="#231f20"/>
      <circle cx="258" cy="238" r="17" fill="#231f20"/>
      <circle cx="170" cy="234" r="6" fill="#FFFFFF"/>
      <circle cx="264" cy="232" r="6" fill="#FFFFFF"/>
      <!-- すぼめた口＋口元の緑（証拠） -->
      <ellipse cx="200" cy="300" rx="12" ry="10" fill="#231f20"/>
      <path d="M 182 312 Q 200 322 220 310 Q 212 320 198 320 Q 188 318 182 312 Z" fill="#8BCB59" opacity="0.9"/>
      <!-- 口笛の音符 -->
      <g id="whistle" transform="translate(300,196)">
        <path d="M 0 26 Q 0 6 14 2 L 30 -2 L 30 20" fill="none" stroke="#3d6b1e" stroke-width="6"/>
        <circle cx="-2" cy="28" r="9" fill="#3d6b1e"/>
        <circle cx="28" cy="22" r="9" fill="#3d6b1e"/>
      </g>
    </g>

    <!-- ===== 表情: 固まり（X目・棒口） ===== -->
    <g id="expr-x" style="display:none">
      <g stroke="#231f20" stroke-width="9" stroke-linecap="round">
        <path d="M 136 232 L 170 264 M 170 232 L 136 264"/>
        <path d="M 230 232 L 264 264 M 264 232 L 230 264"/>
      </g>
      <path d="M 184 302 L 216 302" fill="none" stroke="#3d6b1e" stroke-width="7"/>
    </g>
  </g>
</svg>
    </div>
    <svg class="clip" id="mini" data-start="9.5" data-duration="2.5" data-track-index="8" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
      <rect x="76" y="8" width="14" height="70" rx="7" fill="#8BCB59" stroke="#3d6b1e" stroke-width="5" transform="rotate(8 83 43)"/>
      <path d="M 40 80 L 160 80 L 146 280 Q 145 292 132 292 L 68 292 Q 55 292 54 280 Z" fill="#6FB234" stroke="#3d6b1e" stroke-width="7"/>
      <rect x="52" y="130" width="96" height="60" fill="#f6f9ef"/>
      <text x="100" y="172" text-anchor="middle" font-size="30" font-weight="900" fill="#3d6b1e">ずんだ茶寮</text>
    </svg>

    <!-- track3: テロップ・吹き出し -->
    <div class="clip" id="hook" data-start="0" data-duration="1.5" data-track-index="3">
      <div>まだ飲んでないのに、</div><div>減ってる。</div>
    </div>
    <div class="sub clip" id="q" data-start="1.5" data-duration="2.5" data-track-index="3" style="opacity:0">……ん？</div>
    <div class="sub clip" id="line-k" data-start="4" data-duration="3" data-track-index="3" style="opacity:0">「ずんちゃ丸、飲んだでしょ？」</div>
    <div class="bubble clip" id="line-z" data-start="4" data-duration="3" data-track-index="4">飲んでないよ〜</div>
    <div class="clip" id="bang" data-start="7" data-duration="2.5" data-track-index="5">！</div>
    <div class="sub clip" id="line-k4" data-start="7" data-duration="2.5" data-track-index="3" style="opacity:0">「全部つながってるよ」</div>
    <div class="sub clip" id="line-k5" data-start="9.5" data-duration="2.5" data-track-index="3" style="opacity:0">「次は一緒に飲もうね」</div>
    <div class="bubble clip" id="wai" data-start="9.5" data-duration="2.5" data-track-index="4">わーい！</div>

    <!-- track4: 最終コピーカード -->
    <div class="clip" id="card" data-start="9.5" data-duration="2.5" data-track-index="6">
      <div class="copy-main">隠せない、おいしさ。</div>
      <div class="copy-sub">ずんだ茶寮　ずんだシェイク</div>
    </div>

    <!-- 音声: BGM+SE（gen_audio.py の合成 wav） -->
    <audio class="clip" id="bgm" data-start="0" data-duration="12" data-track-index="9" src="media/mix.wav"></audio>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // ── 初期状態（各クリップ窓の開始時に境界 set） ──
    tl.set("#straw1", { rotation: 20, scaleX: 0 }, 0)
      .set("#straw2", { rotation: 16 }, 1.5)
      .set("#straw3", { rotation: 12 }, 4)
      .set("#line-z", { xPercent: -50, scale: 0 }, 4)
      .set("#straw4a", { rotation: 38 }, 7)
      .set("#straw4b", { rotation: -24 }, 7)
      .set("#bang", { scale: 0 }, 7)
      .set("#wai", { scale: 0 }, 9.5)

    // ── b1 (0–1.5): フック＋伸びるストロー ──
      .from("#hook", { autoAlpha: 0, y: -30, duration: 0.35, ease: "power2.out" }, 0.05)
      .to("#straw1", { scaleX: 1, duration: 0.65, ease: "power3.out" }, 0.45)
      .to("#straw1", { rotation: 21.5, duration: 0.12, yoyo: true, repeat: 3, ease: "sine.inOut" }, 1.1)

    // ── b2 (1.5–4.0): 吸うストロー＋「……ん？」 ──
      .to("#straw2", { rotation: 17.5, duration: 0.1, yoyo: true, repeat: 5, ease: "sine.inOut" }, 1.7)
      .to("#straw2", { rotation: 17.5, duration: 0.1, yoyo: true, repeat: 5, ease: "sine.inOut" }, 2.5)
      .to("#q", { opacity: 1, duration: 0.3 }, 3.3)

    // ── b3 (4.0–7.0): 犯人発覚 ──
      .set("#expr-normal", { display: "none" }, 4)
      .set("#expr-puffed", { display: "block" }, 4)
      .set("#zuncha-wrap", { x: -80, rotation: -4 }, 4)
      .to("#zuncha-wrap", { x: 0, duration: 0.55, ease: "back.out(1.5)" }, 4.15)
      .to("#line-k", { opacity: 1, duration: 0.3 }, 4.5)
      .to("#zuncha-wrap", { rotation: 4, duration: 0.5, yoyo: true, repeat: 2, ease: "sine.inOut" }, 4.8)
      .to("#line-z", { scale: 1, duration: 0.4, ease: "back.out(2)" }, 5.7)

    // ── b4 (7.0–9.5): 転倒→固まる（境界で位置ジャンプ） ──
      .set("#zuncha-wrap", { y: 150, scale: 0.933, rotation: 0, x: 0 }, 7)
      .to("#zuncha-wrap", { x: -60, duration: 0.4, ease: "power1.in" }, 7.1)
      .to("#zuncha-wrap", { rotation: -74, y: 270, duration: 0.45, ease: "bounce.out" }, 7.5)
      .to("#bang", { scale: 1, duration: 0.25, ease: "back.out(2.5)" }, 7.55)
      .set("#expr-puffed", { display: "none" }, 8.05)
      .set("#expr-x", { display: "block" }, 8.05)
      .to("#line-k4", { opacity: 1, duration: 0.3 }, 8.15)
      .to("#bang", { autoAlpha: 0, duration: 0.3 }, 8.6)

    // ── b5 (9.5–12.0): 承認→わーい→コピー ──
      .set("#expr-x", { display: "none" }, 9.5)
      .set("#expr-happy", { display: "block" }, 9.5)
      .set("#zuncha-wrap", { x: -70, y: 100, scale: 0.767, rotation: 0 }, 9.5)
      .to("#line-k5", { opacity: 1, duration: 0.25 }, 9.6)
      .from("#mini", { y: 200, autoAlpha: 0, duration: 0.4, ease: "back.out(1.4)" }, 9.65)
      .to("#wai", { scale: 1, duration: 0.35, ease: "back.out(2.2)" }, 10.1)
      .to("#zuncha-wrap", { y: 70, duration: 0.25, yoyo: true, repeat: 3, ease: "sine.inOut" }, 10.1)
      .to("#card", { opacity: 1, duration: 0.45 }, 11.1);

    window.__timelines["main"] = tl;
  </script>
</body>
</html>
